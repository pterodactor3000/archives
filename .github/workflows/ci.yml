name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI help
        run: ./bin/archives --help
      - name: setup
        run: ./bin/archives setup
      - name: status
        run: ./bin/archives status
